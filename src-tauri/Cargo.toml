[package]
name = "meridius"
version = "0.1.2"
description = "VK Music Player"
authors = ["Infinite Software"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = ["devtools", "tray-icon", "image-png", "image-ico"] }
tauri-plugin-store = "2.4.2"
tauri-plugin-fs = "2.4.5"
tauri-plugin-opener = "2.5.3"
tauri-plugin-dialog = "2.5.0"
tauri-plugin-os = "2.3.2"
tauri-plugin-updater = "2.9.0"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-shell = "2.3.4"
reqwest = { version = "0.12", features = ["blocking", "json"], default-features = false }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
