name: Build

on:
  push:
    branches:
      - development
      - production
  pull_request:
    branches:
      - development
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || github.base_ref != 'production'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Install dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install postject
        run: npm install -g postject

      - name: Generate version
        run: node scripts/generate-version.js
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAURI_PUBLIC_KEY: ${{ secrets.TAURI_PUBLIC_KEY }}

      - name: Build application
        run: npm run build:windows
        env:
          ESBUILD_WORKER_THREADS: 0
          ESBUILD_USE_INLINE_CACHE: 1
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_COOKIE_KEY: ${{ secrets.NUXT_COOKIE_KEY }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}

      - name: Build Tauri app
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_COOKIE_KEY: ${{ secrets.NUXT_COOKIE_KEY }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}

      - name: Get version
        id: get_version
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ steps.get_version.outputs.version }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.base_ref != 'production'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Install dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install postject
        run: npm install -g postject

      - name: Generate version
        run: node scripts/generate-version.js
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAURI_PUBLIC_KEY: ${{ secrets.TAURI_PUBLIC_KEY }}

      - name: Make build script executable
        run: chmod +x build/linux.sh

      - name: Build application
        run: ./build/linux.sh
        env:
          ESBUILD_WORKER_THREADS: 0
          ESBUILD_USE_INLINE_CACHE: 1
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_COOKIE_KEY: ${{ secrets.NUXT_COOKIE_KEY }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}

      - name: Build Tauri app
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_COOKIE_KEY: ${{ secrets.NUXT_COOKIE_KEY }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}

      - name: Get version
        id: get_version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Linux artifacts archive
        run: |
          mkdir -p artifacts/linux
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/linux/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/linux/ 2>/dev/null || true
          tar -czf linux-build-${{ steps.get_version.outputs.version }}.tar.gz -C artifacts/linux .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-${{ steps.get_version.outputs.version }}
          path: linux-build-${{ steps.get_version.outputs.version }}.tar.gz
          if-no-files-found: warn
          retention-days: 30

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/production' || github.ref == 'refs/heads/beta') && github.ref != 'refs/heads/development'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build-${{ steps.get_version.outputs.version }}
          path: ./artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build-${{ steps.get_version.outputs.version }}
          path: ./artifacts/linux

      - name: Extract Linux artifacts
        run: |
          mkdir -p ./artifacts/linux-extracted
          tar -xzf ./artifacts/linux/linux-build-${{ steps.get_version.outputs.version }}.tar.gz -C ./artifacts/linux-extracted

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          prerelease: ${{ github.ref == 'refs/heads/beta' }}
          files: |
            ./artifacts/windows/**
            ./artifacts/linux-extracted/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-development-release:
    name: Create Development Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && github.ref != 'refs/heads/production' && github.ref != 'refs/heads/beta'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build-${{ steps.get_version.outputs.version }}
          path: ./artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build-${{ steps.get_version.outputs.version }}
          path: ./artifacts/linux

      - name: Extract Linux artifacts
        run: |
          mkdir -p ./artifacts/linux-extracted
          tar -xzf ./artifacts/linux/linux-build-${{ steps.get_version.outputs.version }}.tar.gz -C ./artifacts/linux-extracted

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Development Build v${{ steps.get_version.outputs.version }}
          prerelease: true
          files: |
            ./artifacts/windows/**
            ./artifacts/linux-extracted/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/production')
    environment: ${{ github.ref == 'refs/heads/production' && 'production' || 'development' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: image_tag
        run: |
          if [ "${{ github.ref }}" == "refs/heads/production" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=nightly" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          registry: docker.io

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/meridius-nova
          tags: |
            type=raw,value=${{ steps.image_tag.outputs.tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NUXT_SESSION_PASSWORD=${{ secrets.NUXT_SESSION_PASSWORD }}
            NUXT_COOKIE_KEY=${{ secrets.NUXT_COOKIE_KEY }}
            DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
            DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/meridius-nova:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/meridius-nova:buildcache,mode=max